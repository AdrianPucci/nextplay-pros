<style>
  :root { --navy:#0f1b2d; --orange:#ff5a1f; --ice:#9fdcec; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:#050b16; color:#fff; font-family:Inter, "Segoe UI", Arial, sans-serif; overflow:hidden; }
  .scene { position:fixed; inset:0; opacity:0; pointer-events:none; }

  @keyframes push { to { transform:scale(1.02); } }

  .band { position:absolute; inset:0; background:#0f1b2d url("img/athletes-band.jpg") 0% center / cover no-repeat; }

  @keyframes pan { from { background-position:0% center; transform:scale(1.18); } to { background-position:100% center; transform:scale(1.04); } }
  .brand { position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
  .word { font-size:clamp(40px,8vw,120px); font-weight:900; letter-spacing:-.035em; text-shadow:0 8px 40px rgba(0,0,0,.6); }
  .word span { color:var(--orange); }
  .logo { width:clamp(56px,7vw,96px); height:clamp(56px,7vw,96px); background:var(--orange); border-radius:18px; display:inline-grid; place-items:center; margin-bottom:2vh; }
  #map { background:radial-gradient(900px 500px at 50% 40%, #13223a, #050b16); }

  .town .city { position:absolute; inset:0; width:100%; height:100%; opacity:1; transform:scale(1.15); transition:transform 2.2s ease-out;
               -webkit-mask-image:radial-gradient(ellipse at center,#000 50%,transparent 80%); mask-image:radial-gradient(ellipse at center,#000 50%,transparent 80%); }
  #map.on .town .city { transform:scale(1); }
  .ping { position:absolute; width:16px; height:16px; border-radius:50%; background:var(--ice); opacity:0; z-index:1; }
  #map.on .ping { animation:pop .4s ease forwards, ring 1.4s .4s infinite; }
  .ping.me { width:26px; height:26px; background:var(--orange); }
  @keyframes pop { from { opacity:0; transform:scale(.2); } to { opacity:1; transform:none; } }
  @keyframes ring { 0% { box-shadow:0 0 0 0 rgba(159,220,236,.55); } 100% { box-shadow:0 0 0 22px rgba(159,220,236,0); } }
  .map-line { position:absolute; left:6vw; right:6vw; bottom:9vh; text-align:center; font-weight:900; font-size:clamp(26px,4.6vw,64px); letter-spacing:-.03em; text-transform:uppercase; text-shadow:0 6px 30px rgba(0,0,0,.7); }

<script>
const LINES = ["You were a star.", "Or you’re becoming one.", "Your community wants you.", "They just can’t find you."];
const IDS = ["sh0", "sh1", "sh2", "sh3", "sh4", "sh5", "sh6", "sh7"];
const SCRIPT = [["open", 1.6, ""]];
IDS.forEach((id, i) => SCRIPT.push([id, 1.1, i % 2 === 0 ? LINES[i / 2] : null]));
SCRIPT.push(["map", 2.2, ""], ["end", 2.6, ""]);
const TOTAL = SCRIPT.reduce((n, s) => n + s[1], 0);
let timers = [], t0 = 0, raf = 0;
const head = document.querySelector(".headline");
function setHead(text) {
  if (text === null) return;
  const words = text ? text.split(" ") : [];
  head.innerHTML = words.map((w, i) => `<span style="animation-delay:${i * 0.07}s">${i === words.length - 1 ? "<em>" + w + "</em>" : w}</span>`).join(" ");
  requestAnimationFrame(() => head.querySelectorAll("span").forEach((s) => s.classList.add("in")));
}
function show(id) { document.querySelectorAll(".scene").forEach((s) => s.classList.toggle("on", s.id === id)); }
function tick() { const p = Math.min(1, (performance.now() - t0) / (TOTAL * 1000)); document.getElementById("bar").style.width = p * 100 + "%"; if (p < 1) raf = requestAnimationFrame(tick); }
function play() {
  timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); document.getElementById("start").hidden = true;
  let at = 0;
  SCRIPT.forEach(([id, secs, text]) => { timers.push(setTimeout(() => { show(id); setHead(text); }, at * 1000)); at += secs; });
  t0 = performance.now(); tick();
}
document.getElementById("play").onclick = play; document.getElementById("replay").onclick = play;
document.getElementById("close").onclick = () => parent.postMessage("close-story", "*");
const q = new URLSearchParams(location.search);
if (q.get("rec")) document.body.classList.add("rec");
document.querySelectorAll("img").forEach((i) => { const im = new Image(); im.src = i.src; });  // preload so hard cuts never blank
if (q.get("autoplay")) setTimeout(play, 300); else show("open");
